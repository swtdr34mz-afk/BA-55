# BA-55 build settings (fm1-base tools/build.py). The pixel type of the screens: X0X_FONTSET=terminus in the
# environment (the workflow sets it; for a local build: X0X_FONTSET=terminus python3 fm1-base/tools/build.py . --host)
name = "ba55"                   # the build's file names: ba55-0.1.fwsc, build/host/ba55_host
title = "BA-55"                  # the name people see (firmware hubs)
id_prefix = "FM-1_592"            # package identity: dev FM-1_59200, releases FM-1_592 + XXYYZZ (MONSUN 591)
usb_manufacturer = "swtdr34mz"
usb_product = "BA-55 FM-1"       # the USB name (the MIDI port in a DAW)
o2 = ["dsp/ba55_core.c"]        # the sound core, at -O2 (the same files a VST would use)
include = ["dsp"]
vendored = ["fm1-base/"]          # fm1-base is a submodule inside the app: its own checks are its own
words = "words.tsv"
ble = false
tagline = "A bassline after the Erica Synths DB-01: one VCO, sub, noise, detune, an acid filter, drive, accent and slide, a 64-step sequencer"
repo = "https://github.com/swtdr34mz-afk/BA-55"
licence = "MPL-2.0"
credits = "Built on fm1-base (Charles Vestal) and felucca-bsp (Leo Kuroshita, Hügelton Instruments)."
author = "swtdr34mz"
description = "A monophonic bassline in the manner of the Erica Synths Bassline DB-01: one VCO (triangle, saw, square), a sub-oscillator an octave down, noise, a BBD-style DETUNE, an aggressive 12 dB filter in the Polivoks / Acidbox spirit (low-pass or band-pass, saturating, self-oscillating), DRIVE on one knob, envelopes for VCA, filter and pitch, 303-style ACCENT and SLIDE, three modulators, distortion, chorus and delay/reverb, and a 64-step sequencer with accent, slide, tie, probability, swing and a random pattern generator. 16 presets, MIDI clock in. Unofficial."
tags = ["synth"]
install = "https://github.com/swtdr34mz-afk/BA-55/releases"
screenshot = "site/img/screen-main.png"
